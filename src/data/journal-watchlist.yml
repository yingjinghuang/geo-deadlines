# Discovery-only source of truth for journal CFP sweeps.
# This file is not loaded as a public deadline opportunity. During every data
# refresh, scan each journal below for new Special Issues, Article Collections,
# and Calls for Papers. Only create an opportunity when an official publisher
# source gives a concrete submission deadline (or an explicitly announced TBD
# call that is important enough to track).

last_reviewed: "2026-08-25"
seed_source:
  name: "Awesome Autonomous GeoAI"
  url: "https://github.com/AutoGeoAI4Sci/awesome-autonomous-geoai#journals"

policy:
  source_priority: "Official journal or publisher pages first; discovery sources are leads only."
  inclusion: "Track deadline-bearing special issues, article collections, and calls for papers that are materially relevant to GIScience, GeoAI, remote sensing, Earth observation, spatial data science, geography, or urban analytics."
  exclusion: "Do not create permanent entries for ordinary rolling journal submissions without a deadline."
  refresh: "Review every journal in this file whenever GeoDeadlines receives a substantive data refresh."

