description: An 80–100% WSL postdoc using GIS, participatory mapping and quantitative surveys to study
  how urban density, building types and green-space diversity affect wellbeing. The two-year Dense-Green-Health
  project covers three Swiss cities and starts January 2027. Fluent English and good German and French
  are required.
