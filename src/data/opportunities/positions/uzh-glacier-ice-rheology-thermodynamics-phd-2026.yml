description: Four-year funded PhD at 80% employment in UZH Geography’s LISERT project on glacier ice deformation. Work combines field experiments, numerical ice-flow models and structural analysis, with drone multispectral and thermal mapping for glacier context. This adjacent physical-geography opportunity requires relevant master’s training, mechanics/modeling skills and glacier-fieldwork ability.
