description: "Two four-year fully funded PhD positions in the National University of Singapore Urban Analytics Lab. One focuses on sensing urban change with time-series street imagery and crowdsourced urban data; the other develops trustworthy urban AI addressing data quality, bias and uncertainty with multimodal urban datasets. Lab application is due 29 November 2026, followed by university admission for the August 2027 or January 2028 intake."
