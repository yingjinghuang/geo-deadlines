description: "Three-year full-time TV-L E13 postdoc at Leibniz IAMO leading geospatial analyses in the TransMoP project on arid land degradation, water stress, vegetation dynamics and climate-related human mobility in Uzbekistan and Kazakhstan. Methods include Landsat, Sentinel, MODIS and ERA5 time-series analysis, spatial mapping, modelling and reproducible Python/R workflows."
