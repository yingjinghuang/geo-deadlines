description: One temporary Professor Substituto appointment in the Geography Department at Universidade Federal do Triângulo Mineiro, Uberaba, under Edital 33/2026, Lotação 05. The 40-hour-per-week post covers basic cartography, geocartography, remote sensing, photogrammetry and applied probability and statistics. Applicants require a Geography undergraduate degree and a doctorate in one of the specified geography, cartographic engineering, environmental, surveying, remote-sensing or geoscience fields.
