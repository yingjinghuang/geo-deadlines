title: Postdoc — Land Modeling and Satellite Data Assimilation
short_name: UMD Land Modeling + Satellite Assimilation Postdoc
type: position
position_category: postdoc
year: 2026
description: CISESS postdoctoral position integrating satellite leaf-area-index observations and phenology into NOAA’s Unified Forecast System and evaluating land-atmosphere impacts. The initial appointment is one year, renewable subject to performance and funding. Candidates need a relevant PhD awarded within the previous three years and experience with land models and satellite surface-property methods.
