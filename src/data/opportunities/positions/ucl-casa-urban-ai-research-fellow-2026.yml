description: "UCL Bartlett CASA is recruiting a Research Fellow for an Innovate UK-funded project on intelligent buffered ultra-rapid EV charging. The role develops spatial and spatiotemporal AI, demand prediction, deep reinforcement learning or related optimisation methods, and data-driven energy management using EV charging, transport, energy and geospatial datasets. The advertised appointment is initially funded from January through December 2027."
