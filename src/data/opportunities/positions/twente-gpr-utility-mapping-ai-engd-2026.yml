description: "A two-year salaried Engineering Doctorate (EngD), distinct from a traditional research PhD, at the University of Twente, developing and validating machine-learning models to detect and characterize underground infrastructure (cables and pipelines) from ground-penetrating radar observations. Work combines geomatics, geospatial datasets, geophysics/GPR and deep learning with a 40% educational component and 60% applied engineering design component; initial 2027 start."
