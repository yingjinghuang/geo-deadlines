description: "A 12-month UKRI-funded Research Associate post in the University of Glasgow's RESPECT project (Work Package 3), developing the Peatland Triage Tool, a geospatial decision-support application for peatland restoration. The role involves GIS, spatial data integration, geospatial web applications (e.g. GDAL, Python, GeoJSON/WMS/WFS, Leaflet/Mapbox), and machine learning/AI-driven reasoning. Full-time, Grade 7 (£41,885–£46,970), job reference 211653."
