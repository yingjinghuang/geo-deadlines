description: Full-time teaching and research appointment in Earth System Modelling at the University of Liège, normally at lecturer grade, starting 1 September 2027. Research links ocean, atmosphere and biosphere through community numerical models and will integrate the GIRPAS atmospheric remote-sensing programme, including Jungfraujoch FTIR measurements. The usual initial four-year appointment can become permanent after positive evaluation; exceptional immediate permanent appointment is possible.
