description: "Fully funded EPSRC Doctoral Landscape Award studentship at the University of Exeter for September 2027 entry, researching satellite radar and multi-mission Earth observation for permafrost degradation and erosion in the changing Arctic. One of the original Department of Earth and Environmental Science EPSRC DLA projects, with a competitive funding selection process and eligibility/residency conditions. Candidates must apply for their selected individual project through the University's EPSRC DLA scheme."
