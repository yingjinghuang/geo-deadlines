description: A UQ–CSIRO doctoral scholarship combining satellite observations, vegetation and soil-moisture
  layers, climate data and population monitoring to predict mouse outbreaks. The project emphasises spatiotemporal
  statistics and operational environmental forecasting. Tuition and stipend support are advertised; eligibility
  is restricted to domestic students.
