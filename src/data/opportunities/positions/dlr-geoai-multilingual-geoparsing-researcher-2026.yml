description: "Up-to-three-year research position at the DLR Institute of Data Science in Jena working on the DFG-funded GeoMMCorpus+Eval project. The role develops GeoAI methods for multilingual geo-parsing, geographic text-corpus creation and annotation, LLM-assisted annotation and quality assurance, information extraction, large heterogeneous text datasets and human-in-the-loop evaluation."
