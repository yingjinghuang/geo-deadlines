description: "Four-year full-time pre-doctoral university-assistant position at TU Graz's Institute of Geodesy, with research and doctoral development in Geoinformation. The advertised profile explicitly targets GeoAI and GIScience topics including spatial representation and reasoning, spatial computation and algorithms, geographic information retrieval, geo-social sensing, machine learning and spatial data science; Python and GIS software such as ArcGIS or QGIS are relevant skills. The intended start is March 2027."
